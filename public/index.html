<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    .auth { margin: 24px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth label { display: block; margin: 12px 0 5px; }
    .auth input { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #8193a9; background: #101a28; color: #ecf4ff; font: inherit; }
    .auth button { margin-top: 15px; padding: 11px 18px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    #auth-message { margin: 12px 0 0; font-size: 15px; white-space: pre-wrap; }
    #editor { margin: 20px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    #editor label { display: block; margin: 12px 0 5px; }
    #editor input, #editor textarea { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #8193a9; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    #editor button, .note-actions button { padding: 8px 13px; margin: 8px 8px 0 0; border: 1px solid #8193a9; border-radius: 8px; background: #283e55; color: #ecf4ff; cursor: pointer; }
    #editor[hidden] { display: none; }
    .note-actions { margin-top: 10px; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 1단계 피해 확인</div>
    <h1>점령된 자료실</h1>
    <p>로그인한 사용자만 아래 가상 자료를 읽을 수 있습니다.</p>
    <div class="notice">서버가 로그인 증명서를 검사합니다. 로그인하지 않은 요청은 거부됩니다.</div>
    <section class="auth" aria-label="로그인">
      <form id="login-form">
        <h2>자료실 로그인</h2>
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p id="signed-in-email"></p>
        <button id="logout" type="button">로그아웃</button>
      </div>
      <p id="auth-message" role="status" aria-live="polite"></p>
    </section>
    <form id="editor" hidden>
      <h2 id="editor-heading">가상 메모 추가</h2>
      <label for="note-title">제목</label>
      <input id="note-title" maxlength="200" required>
      <label for="note-body">내용</label>
      <textarea id="note-body" rows="4" maxlength="10000" required></textarea>
      <button type="submit" id="save-note">저장</button>
      <button type="button" id="cancel-edit">취소</button>
      <p id="editor-message" role="status" aria-live="polite"></p>
    </form>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    const loginForm = document.querySelector('#login-form');
    const signedIn = document.querySelector('#signed-in');
    const signedInEmail = document.querySelector('#signed-in-email');
    const authMessage = document.querySelector('#auth-message');
    const logoutButton = document.querySelector('#logout');
    let activeSession = null;
    let editingId = null;
    const editor = document.querySelector('#editor');
    const editorHeading = document.querySelector('#editor-heading');
    const editorMessage = document.querySelector('#editor-message');
    const titleInput = document.querySelector('#note-title');
    const bodyInput = document.querySelector('#note-body');
    function startEdit(note = null) {
      editingId = note?.id ?? null;
      editorHeading.textContent = note ? '가상 메모 수정' : '가상 메모 추가';
      titleInput.value = note?.title ?? '';
      bodyInput.value = note?.body ?? '';
      editorMessage.textContent = '';
      titleInput.focus();
    }
    // A single in-flight refresh prevents refresh-token rotation races.
    let sessionCheck = null;
    async function ensureServerSession() {
      if (!sessionCheck) {
        sessionCheck = (async () => {
          const response = await fetch('/api/auth', { cache: 'no-store' });
          if (!response.ok) {
            if (response.status === 401) showSession(null);
            throw new Error(response.status === 401 ? '로그인이 만료됐습니다. 다시 로그인해 주세요.' : '인증 서버에 연결할 수 없습니다.');
          }
          return response.json();
        })().finally(() => { sessionCheck = null; });
      }
      return sessionCheck;
    }
    async function authenticatedFetch(path, options = {}) {
      let response = await fetch(path, options);
      if (response.status !== 401 || !activeSession) return response;
      await ensureServerSession();
      // Retry only after a successful server-side session validation/refresh.
      response = await fetch(path, options);
      return response;
    }
    async function requestNotes(method, path, body) {
      if (!activeSession) throw new Error('먼저 로그인해 주세요.');
      const response = await authenticatedFetch(path, {
        method,
        cache: 'no-store',
        headers: {
          ...(body ? { 'Content-Type': 'application/json' } : {})
        },
        ...(body ? { body: JSON.stringify(body) } : {})
      });
      if (!response.ok) throw new Error(response.status === 401 ? '로그인 확인 실패' : `요청 실패 (HTTP ${response.status})`);
      return response.json();
    }
    editor.addEventListener('submit', async event => {
      event.preventDefault();
      const save = document.querySelector('#save-note');
      save.disabled = true;
      editorMessage.textContent = '저장 중...';
      try {
        const payload = { title: titleInput.value, body: bodyInput.value };
        if (editingId) await requestNotes('PUT', `/api/notes/${editingId}`, payload);
        else await requestNotes('POST', '/api/notes', payload);
        startEdit();
        editorMessage.textContent = '저장했습니다.';
        await loadNotes(activeSession);
      } catch (error) {
        editorMessage.textContent = error.message;
      } finally {
        save.disabled = false;
      }
    });
    document.querySelector('#cancel-edit').addEventListener('click', () => startEdit());
    const list = document.querySelector('#notes');
    let loadSequence = 0;
    async function loadNotes(session) {
      const sequence = ++loadSequence;
      list.replaceChildren(document.createElement('li'));
      list.firstChild.textContent = session ? '자료를 불러오는 중입니다.' : '로그인하면 자료를 볼 수 있습니다.';
      editor.hidden = !session;
      if (!session) { startEdit(); return; }
      try {
        const response = await authenticatedFetch('/api/notes', {
          cache: 'no-store',
          headers: {}
        });
        if (!response.ok) throw new Error(response.status === 401 ? '로그인 확인에 실패했습니다. 다시 로그인해 주세요.' : '자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (sequence !== loadSequence) return;
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.body;
          const actions = document.createElement('div');
          actions.className = 'note-actions';
          const edit = document.createElement('button');
          edit.type = 'button';
          edit.textContent = '수정';
          edit.addEventListener('click', () => startEdit(note));
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = '삭제';
          remove.addEventListener('click', async () => {
            if (!confirm('이 가상 메모를 삭제할까요? 삭제 후 되돌릴 수 없습니다.')) return;
            remove.disabled = true;
            try {
              await requestNotes('DELETE', `/api/notes/${note.id}`);
              await loadNotes(activeSession);
            } catch (error) {
              authMessage.textContent = `삭제 실패: ${error.message}`;
              remove.disabled = false;
            }
          });
          actions.append(edit, remove);
          item.append(title, content, actions);
          return item;
        }));
      } catch (error) {
        if (sequence !== loadSequence) return;
        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }
    function showSession(session) {
      activeSession = session;
      void loadNotes(session);
      const loggedIn = Boolean(session);
      loginForm.hidden = loggedIn;
      signedIn.hidden = !loggedIn;
      signedInEmail.textContent = loggedIn ? `로그인 계정: ${session.email ?? '이메일 없음'}` : '';
      if (loggedIn) document.querySelector('#password').value = '';
    }
    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      const button = loginForm.querySelector('button');
      button.disabled = true;
      authMessage.textContent = '로그인 확인 중...';
      try {
        const response = await fetch('/api/auth', {
          method: 'POST', cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.querySelector('#email').value.trim(), password: document.querySelector('#password').value })
        });
        if (!response.ok) throw new Error('아이디 또는 비밀번호를 확인해 주세요.');
        showSession(await response.json());
        authMessage.textContent = '로그인에 성공했습니다.';
      } catch (error) {
        authMessage.textContent = `로그인 실패: ${error.message ?? '다시 시도해 주세요.'}`;
      } finally {
        button.disabled = false;
      }
    });
    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      authMessage.textContent = '로그아웃 중...';
      try {
        const response = await fetch('/api/auth', { method: 'DELETE', cache: 'no-store' });
        if (!response.ok) throw new Error('로그아웃 요청에 실패했습니다.');
        showSession(null);
        authMessage.textContent = '로그아웃했습니다.';
      } catch (error) {
        authMessage.textContent = `로그아웃 실패: ${error.message ?? '다시 시도해 주세요.'}`;
      } finally {
        logoutButton.disabled = false;
      }
    });
    try {
      const response = await fetch('/api/auth', { cache: 'no-store' });
      if (response.ok) showSession(await response.json());
      else if (response.status === 401) showSession(null);
      else throw new Error(`HTTP ${response.status}`);
    } catch (error) {
      showSession(null);
      authMessage.textContent = `로그인 상태 확인 실패: ${error.message ?? '다시 시도해 주세요.'}`;
    }
  </script>
</body>
</html>
